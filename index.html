<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A collection of classic browser games." />
  <title>Browser Game Hub</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/games.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">🎮 Browser Game Hub</div>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#games" class="btn-primary btn-small">Play Now</a>
    </nav>
  </header>
  <main id="app">
    <section class="hero">
      <h1>Classic games, ready to play</h1>
      <p>Eight browser games with no downloads or accounts required.</p>
      <div class="highlights" aria-label="Site highlights">
        <span class="highlight-item">⚡ Instant Play</span>
        <span class="highlight-item">🏆 High Scores Saved</span>
        <span class="highlight-item">📱 Mobile Friendly</span>
      </div>
    </section>
    <section id="games" class="game-grid" aria-label="Available games"></section>
  </main>
  <footer class="site-footer"><p>Browser Game Hub — playable offline after loading.</p></footer>
  <script src="/js/storage.js"></script>
  <script src="/js/game-registry.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
