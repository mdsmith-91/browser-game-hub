<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Minesweeper</title><link rel="stylesheet" href="/css/main.css" /><link rel="stylesheet" href="/css/games.css" /><link rel="stylesheet" href="./style.css" /></head><body><main class="game-container"><a href="/" id="backToHub" class="back-btn">Back to Game Hub</a><h1 class="game-title">Minesweeper</h1><div class="game-header"><div class="game-controls"><button class="btn-secondary game-btn restart-btn">New Game</button><label class="control-group">Mode <select id="mode-select" class="mode-select"><option value="single">Single Player</option><option value="duel">Two Players Duel</option></select></label><label class="control-group">Difficulty <select id="difficulty-select" class="mode-select"><option value="beginner">Beginner (9x9)</option><option value="intermediate">Intermediate (16x16)</option><option value="expert">Expert (30x16)</option></select></label></div><div class="game-info-bar"><div class="stat-box"><div class="label">Time</div><div class="value" id="timer">0:00</div></div><div class="stat-box"><div class="label">Mines</div><div class="value" id="mine-count">10</div></div><div class="stat-box"><div class="label">Player 1</div><div class="value" id="player-one-score">-</div></div><div class="stat-box"><div class="label">Player 2</div><div class="value" id="player-two-score">-</div></div><div class="stat-box"><div class="label">Flags Left</div><div class="value" id="flags-left">10</div></div><div class="stat-box"><div class="label">Best Time</div><div class="value" id="best-time">--:--</div></div></div></div><div id="game-board"></div><p id="mine-status" class="board-labels" aria-live="polite"></p><p class="board-labels">Duel: alternate valid reveals. Each newly revealed safe cell is +1; a mine is -3 and passes the turn. Flags are disabled.</p></main><script src="/js/storage.js"></script><script src="/games/minesweeper/game.js"></script></body></html>
