<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/games.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="game-container">
    <a href="#" id="backToHub" class="back-btn">← Back to Hub</a>
    <h2 class="game-title">Connect Four</h2>
    
    <div class="game-header">
      <div class="game-controls">
        <button class="btn-secondary game-btn restart-btn">🔄 New Game</button>
        <div class="control-group">
          <span class="stat-box">
          <div class="label">Current Player (Player 1 Red / Player 2 Yellow)</div>
            <div class="value" id="turn-indicator">Red</div>
          </span>
        </div>
      </div>
      
      <div class="game-info-bar">
        <div class="stat-box">
          <div class="label">Player 1 (Red) Wins</div>
            <div class="value" id="red-wins">0</div>
        </div>
        <div class="stat-box">
          <div class="label">Draws</div>
          <div class="value" id="draws">0</div>
        </div>
      </div>
    </div>

    <div id="game-board"></div>
    
    <p class="board-labels">Drop disks into columns. First to 4 in a row wins!</p>
    <p class="board-labels" style="font-size: 0.85rem; margin-top: -0.5rem;">Click any column to drop a disk • Arrow keys select column • Enter/Space to drop</p>
    
    <!-- Touch controls -->
    <div class="touch-controls">
      <button class="touch-control-btn restart-btn" title="Restart Game">🔄</button>
    </div>
  </div>

  <script src="/js/storage.js"></script>
  <script src="/games/connect-four/game.js"></script>
</body>
</html>
