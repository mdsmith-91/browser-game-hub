<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Memory Match</title><link rel="stylesheet" href="/css/main.css" /><link rel="stylesheet" href="/css/games.css" /><link rel="stylesheet" href="./style.css" /></head><body><main class="game-container"><a href="/" id="backToHub" class="back-btn">Back to Game Hub</a><h1 class="game-title">Memory Match</h1><div class="game-header"><div class="game-controls"><button class="btn-secondary game-btn restart-btn">New Game</button><label class="control-group">Mode <select id="mode-select" class="mode-select"><option value="single">Single Player</option><option value="two">Two Players</option></select></label><span class="stat-box"><span class="label">Time</span><span class="value" id="timer">0:00</span></span><span class="stat-box"><span class="label">Moves</span><span class="value" id="moves">0</span></span></div><div class="game-info-bar"><div class="stat-box"><div class="label">Player 1 pairs</div><div class="value" id="player-one-score">-</div></div><div class="stat-box"><div class="label">Player 2 pairs</div><div class="value" id="player-two-score">-</div></div><div class="stat-box"><div class="label">Remaining pairs</div><div class="value"><span id="pairs-found">0</span>/8</div></div><div class="stat-box"><div class="label">Best Time</div><div class="value" id="best-time">--:--</div></div></div></div><div id="game-board"></div><p id="memory-status" class="board-labels" aria-live="polite"></p></main><script src="/js/storage.js"></script><script src="/games/memory/game.js"></script></body></html>
