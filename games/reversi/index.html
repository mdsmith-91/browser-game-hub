<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play standard Reversi against a casual AI or local friend."><link rel="canonical" href="https://alttabtavern.com/games/reversi/"><title>Reversi | Alt Tab Tavern</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/games.css"><link rel="stylesheet" href="./style.css"></head><body><main class="game-container"><a href="/" id="backToHub" class="back-btn">Back to Tavern</a><h1 class="game-title">Reversi</h1><div class="game-header"><div class="game-controls"><button class="btn-secondary game-btn restart-btn">New Game</button><label class="control-group">Mode <select id="mode-select"><option value="computer">Versus AI</option><option value="two">Two Players</option></select></label><div class="control-group"><span>Turn</span><strong id="turn-indicator" aria-live="polite"></strong></div></div><div class="game-info-bar"><div class="stat-box"><span class="label">Games Played</span><span class="value" id="games-played"></span></div><div class="stat-box"><span class="label">Wins</span><span class="value" id="wins"></span></div><div class="stat-box"><span class="label">Losses</span><span class="value" id="losses"></span></div><div class="stat-box"><span class="label">Draws</span><span class="value" id="draws"></span></div><div class="stat-box"><span class="label">Time Played</span><span class="value" id="time-played"></span></div></div></div><div class="piece-count"><span>Black <strong id="black-count">2</strong></span><span>White <strong id="white-count">2</strong></span></div><div id="game-board" aria-label="Reversi board"></div><p class="board-labels">Place a disk on a highlighted square to bracket and flip opposing disks.</p></main><script src="/js/storage.js"></script><script src="/js/game-ui.js"></script><script src="./reversi
