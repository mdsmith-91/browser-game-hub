<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Play American checkers locally with mandatory captures and kings." />
  <link rel="canonical" href="https://alttabtavern.com/games/checkers/" />
  <meta property="og:title" content="Checkers | Alt Tab Tavern" />
  <meta property="og:description" content="Play American checkers locally with mandatory captures and kings." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://alttabtavern.com/games/checkers/" />
  <meta name="theme-color" content="#171512" />
  <title>Checkers | Alt Tab Tavern</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/games.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-container">
    <a href="/" id="backToHub" class="back-btn">Back to Tavern</a>
    <h1 class="game-title">Checkers</h1>
    <div class="game-header">
      <div class="game-controls">
        <button type="button" class="btn-secondary game-btn restart-btn">New Game</button>
        <div class="control-group"><span>Current player</span><strong class="turn-value" id="turn-indicator" aria-live="polite">Red</strong></div>
        <div class="control-group"><span>Captures: Red / White</span><strong class="turn-value"><span id="red-captures">0</span> / <span id="white-captures">0</span></strong></div>
      </div>
      <div class="game-info-bar">
        <div class="stat-box"><span class="label">Red pieces</span><span class="value" id="red-pieces">12</span></div>
        <div class="stat-box"><span class="label">White pieces</span><span class="value" id="white-pieces">12</span></div>
        <div class="stat-box"><span class="label">Red wins</span><span class="value" id="red-wins">0</span></div>
        <div class="stat-box"><span class="label">White wins</span><span class="value" id="white-wins">0</span></div>
      </div>
    </div>
    <div id="game-board" aria-label="Checkers board"></div>
    <p class="board-labels">Red moves first. Select a piece, then a highlighted square. Select the same piece again to cancel.</p>
  </main>
  <script src="/js/storage.js"></script>
  <script src="/js/game-ui.js"></script>
  <script src="/games/checkers/game.js"></script>
</body>
</html>
