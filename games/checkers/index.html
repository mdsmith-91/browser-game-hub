<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkers | Alt Tab Tavern</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/games.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="game-container">
    <a href="#" id="backToHub" class="back-btn">← Back to Alt Tab Tavern</a>
    <h2 class="game-title">Checkers</h2>
    
    <div class="game-header">
      <div class="game-controls">
        <button class="btn-secondary game-btn restart-btn">🔄 New Game</button>
        <div class="control-group">
          <span class="stat-box">
            <div class="label">Current Player (Player 1 Red / Player 2 White)</div>
            <div class="value" id="turn-indicator">Red</div>
          </span>
          <span class="stat-box">
            <div class="label">Captures</div>
            <div class="value"><span id="red-captures">0</span> / <span id="white-captures">0</span></div>
          </span>
        </div>
      </div>
      
      <div class="game-info-bar">
        <div class="stat-box">
          <div class="label">Player 1 Red Pieces</div>
            <div class="value" id="red-pieces">12</div>
        </div>
        <div class="stat-box">
          <div class="label">Player 2 White Pieces</div>
          <div class="value" id="white-pieces">12</div>
        </div>
      </div>
    </div>

    <div id="game-board"></div>
    
    <p class="board-labels">Red moves first. Click a piece to select, then click a valid square to move. Right-click to unselect.</p>
    
    <!-- Touch controls -->
    <div class="touch-controls">
      <button class="touch-control-btn restart-btn" title="Restart Game">🔄</button>
    </div>
  </div>

  <script src="/js/storage.js"></script>
  <script src="/games/checkers/game.js"></script>
</body>
</html>
