<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Snake</title><link rel="stylesheet" href="/css/main.css" /><link rel="stylesheet" href="/css/games.css" /><link rel="stylesheet" href="./style.css" /></head>
<body><main class="game-container"><a href="/" id="backToHub" class="back-btn">Back to Game Hub</a><h1 class="game-title">Snake</h1><div class="game-header"><div class="game-controls"><button class="btn-secondary game-btn restart-btn">New Game</button><label class="control-group" for="mode-select">Mode <select id="mode-select" class="mode-select"><option value="single">Single Player</option><option value="two">Two Players</option></select></label><span class="stat-box"><span class="label">Player 1 Score</span><span class="value" id="score">0</span></span><span class="stat-box"><span class="label">Player 2 Score</span><span class="value" id="player-two-score">-</span></span></div><div class="game-info-bar"><div class="stat-box"><div class="label">High Score</div><div class="value" id="high-score-display">0</div></div><div class="stat-box"><div class="label">Level</div><div class="value" id="level">1</div></div><div class="stat-box"><div class="label">Speed</div><div class="value" id="speed-display">Normal</div></div></div></div><canvas id="game-board" aria-label="Snake game board"></canvas><p id="snake-status" class="board-labels" aria-live="polite"></p><p class="board-labels">Two Players: Player 1 uses WASD; Player 2 uses arrow keys. Both move at once; a shared crash is a draw.</p><div class="touch-controls"><button class="touch-control-btn" data-dir="up">Up</button><button class="touch-control-btn" data-dir="left">Left</button><button class="touch-control-btn" data-dir="down">Down</button><button class="touch-control-btn" data-dir="right">Right</button></div></main><script src="/js/storage.js"></script><script src="/games/snake/game.js"></script></body></html>
