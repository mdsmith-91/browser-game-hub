<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Play classic Snake and chase your high score at Alt Tab Tavern." />
  <link rel="canonical" href="https://alttabtavern.com/games/snake/" />
  <meta property="og:title" content="Snake | Alt Tab Tavern" />
  <meta property="og:description" content="Play classic Snake and chase your high score at Alt Tab Tavern." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://alttabtavern.com/games/snake/" />
  <meta name="theme-color" content="#171512" />
  <title>Snake | Alt Tab Tavern</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/games.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-container">
    <a href="/" id="backToHub" class="back-btn">Back to Tavern</a>
    <h1 class="game-title">Snake</h1>
    <div class="game-header">
      <div class="game-controls">
        <button type="button" class="btn-secondary game-btn restart-btn">New Game</button>
        <div class="stat-box"><span class="label">Score</span><span class="value" id="score">0</span></div>
      </div>
      <div class="game-info-bar">
        <div class="stat-box"><span class="label">High score</span><span class="value" id="high-score-display">0</span></div>
        <div class="stat-box"><span class="label">Games Played</span><span class="value" id="games-played">0</span></div>
        <div class="stat-box"><span class="label">Time Played</span><span class="value" id="time-played">0m 0s</span></div>
        <div class="stat-box"><span class="label">Level</span><span class="value" id="level">1</span></div>
        <div class="stat-box"><span class="label">Speed</span><span class="value" id="speed-display">Normal</span></div>
      </div>
    </div>
    <canvas id="game-board" role="img" aria-label="Snake game board"></canvas>
    <p id="snake-status" class="board-labels" aria-live="polite">Single Player Snake: swipe the board, use the D-pad, or use arrows/WASD to move.</p>
    <div class="touch-controls" aria-label="Snake direction controls">
      <button type="button" class="touch-control-btn" data-dir="up">Up</button>
      <button type="button" class="touch-control-btn" data-dir="left">Left</button>
      <button type="button" class="touch-control-btn" data-dir="down">Down</button>
      <button type="button" class="touch-control-btn" data-dir="right">Right</button>
    </div>
  </main>
  <script src="/js/storage.js"></script>
  <script src="/js/game-ui.js"></script>
  <script src="/games/snake/game.js"></script>
</body>
</html>
