<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play skill-based 301 and Around the Clock darts."><link rel="canonical" href="https://alttabtavern.com/games/darts/"><title>Darts | Alt Tab Tavern</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/games.css"><link rel="stylesheet" href="/css/tavern-games.css"><link rel="stylesheet" href="./style.css"></head><body><main class="game-container"><a href="/" id="backToHub" class="back-btn">Back to Tavern</a><h1 class="game-title">Darts</h1><div class="game-header"><div class="game-controls"><button class="btn-secondary game-btn restart-btn">New Game</button><label class="control-group">Game <select id="rule-select"><option value="301">301</option><option value="clock">Around the Clock</option></select></label><label class="control-group">Mode <select id="mode-select"><option value="one">Single Player</option><option value="two">Two Players</option></select></label><div class="control-group"><span>Turn</span><strong id="turn-indicator" aria-live="polite"></strong></div></div><div class="game-info-bar"><div class="stat-box"><span class="label">Games Played</span><span class="value" id="games-played"></span></div><div class="stat-box"><span class="label">Wins</span><span class="value" id="wins"></span></div><div class="stat-box"><span class="label">Losses</span><span class="value" id="losses"></span></div><div class="stat-box"><span class="label">Time Played</span><span class="value" id="time-played"></span></div></div></div><section class="tavern-table"><div class="tavern-score" id="scoreboard"></div><canvas class="tavern-canvas" id="dartboard" width="500" height="500" aria-label="Dartboard. Tap or click to throw."></canvas><p class="table-status" id="result">Aim, then click or tap the board.</p></section><p class="board-lab
