<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Play Tic-Tac-Toe against an unbeatable computer or a local friend at Alt Tab Tavern." />
  <link rel="canonical" href="https://alttabtavern.com/games/tic-tac-toe/" />
  <meta property="og:title" content="Tic-Tac-Toe | Alt Tab Tavern" />
  <meta property="og:description" content="Play Tic-Tac-Toe against an unbeatable computer or a local friend at Alt Tab Tavern." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://alttabtavern.com/games/tic-tac-toe/" />
  <meta name="theme-color" content="#171512" />
  <title>Tic-Tac-Toe | Alt Tab Tavern</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/games.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-container">
    <a href="/" id="backToHub" class="back-btn">Back to Tavern</a>
    <h1 class="game-title">Tic-Tac-Toe</h1>
    <div class="game-header">
      <div class="game-controls">
        <button type="button" class="btn-secondary game-btn restart-btn">New Game</button>
        <label class="control-group" for="mode-select">Mode <select id="mode-select" class="mode-select"><option value="computer">Versus AI</option><option value="two">Two Players</option></select></label>
        <div class="control-group"><span>Current player</span><strong class="turn-value" id="turn-indicator" aria-live="polite">X</strong></div>
      </div>
      <div class="game-info-bar">
        <div class="stat-box"><span class="label">Games Played</span><span class="value" id="games-played">0</span></div>
        <div class="stat-box"><span class="label">Wins</span><span class="value" id="wins">0</span></div>
        <div class="stat-box"><span class="label">Losses</span><span class="value" id="losses">0</span></div>
        <div class="stat-box"><span class="label">Draws</span><span class="value" id="draws">0</span></div>
        <div class="stat-box"><span class="label">Time Played</span><span class="value" id="time-played">0m 0s</span></div>
      </div>
    </div>
    <div id="game-board" class="board-3x3" aria-label="Tic-Tac-Toe board"></div>
    <p class="board-labels">Player 1 is X and moves first. Make three in a row before your opponent.</p>
  </main>
  <script src="/js/storage.js"></script>
  <script src="/js/game-ui.js"></script>
  <script src="/games/tic-tac-toe/game.js"></script>
</body>
</html>
