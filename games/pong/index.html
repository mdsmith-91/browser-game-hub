<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong | Alt Tab Tavern</title>
  <meta name="description" content="Play fast Pong against the computer or a friend at Alt Tab Tavern." />
  <link rel="canonical" href="https://alttabtavern.com/games/pong/" />
  <meta property="og:title" content="Pong | Alt Tab Tavern" />
  <meta property="og:description" content="Play fast Pong against the computer or a friend at Alt Tab Tavern." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://alttabtavern.com/games/pong/" />
  <meta name="theme-color" content="#171512" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/games.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-container">
    <a href="/" id="backToHub" class="back-btn">Back to Tavern</a>
    <h1 class="game-title">Pong</h1>
    <div class="game-header"><div class="game-controls">
      <button type="button" class="btn-secondary game-btn restart-btn">↻ New Match</button>
      <label class="control-group" for="mode-select">Mode <select id="mode-select" class="mode-select"><option value="single">Versus AI</option><option value="local">Two Players</option></select></label>
      <label class="control-group" id="difficulty-control" for="difficulty-select">Difficulty <select id="difficulty-select"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
    </div><div class="game-info-bar pong-stats">
      <div class="stat-box"><div class="label">Player 1</div><div class="value" id="player-one-score">0</div></div>
      <div class="stat-box"><div class="label">Player 2 / CPU</div><div class="value" id="player-two-score">0</div></div>
      <div class="stat-box"><div class="label">Games Played</div><div class="value" id="games-played">0</div></div>
      <div class="stat-box"><div class="label">Wins</div><div class="value" id="wins">0</div></div>
      <div class="stat-box"><div class="label">Losses</div><div class="value" id="losses">0</div></div>
      <div class="stat-box"><div class="label">Time Played</div><div class="value" id="time-played">0m 0s</div></div>
    </div></div>
    <p id="pong-status" class="pong-status" aria-live="polite">First to 5 wins.</p>
    <div class="pong-canvas-wrap"><canvas id="pong-board" role="img" aria-label="Pong playing field"></canvas></div>
    <p class="board-labels">Player 1: W / S · Player 2: ↑ / ↓ · First to 5 wins</p>
    <div class="pong-touch-controls" aria-label="Touch controls"><div><span>Player 1</span><button type="button" data-player="one" data-direction="up" aria-label="Move Player 1 up">↑</button><button type="button" data-player="one" data-direction="down" aria-label="Move Player 1 down">↓</button></div><div id="player-two-touch"><span>Player 2</span><button type="button" data-player="two" data-direction="up" aria-label="Move Player 2 up">↑</button><button type="button" data-player="two" data-direction="down" aria-label="Move Player 2 down">↓</button></div></div>
  </main>
  <script src="/js/storage.js"></script><script src="/js/game-ui.js"></script><script src="/games/pong/game.js"></script>
</body>
</html>
